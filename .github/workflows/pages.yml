name: Deploy clone-v1 to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RELEASE_TAG: clone-v1
  ASSET_NAME: hannerup-kirke-klon.zip
  ASSET_SHA256: 3987363c5eaa61dc162ca0e5ebbba330446af58d6216a68e92a53ca40a25e970

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir release
          echo "$ASSET_SHA256  release/$ASSET_NAME" | sha256sum --check -

      - name: Extract dist
        run: |
          unzip -q "release/$ASSET_NAME" -d site
          test -d site/dist
          touch site/dist/.nojekyll

      - name: Add working-project notice and white header/footer
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<header id="field_top" class="main-header">'
          banner = '''<div class="working-project-notice" style="padding:10px 16px;text-align:center;font-weight:700;background:#fff3cd;color:#5c4600;border-bottom:1px solid #e6d48a;line-height:1.4;">Hannerup Kirke (OBS: Arbejdsprojekt, gå i stedet til <a href="https://hannerup-kirke.dk" style="color:inherit;text-decoration:underline;">https://hannerup-kirke.dk</a>)</div>'''
          white_chrome = '''<style>
          #field_top.main-header {
            background: #ffffff !important;
            background-image: none !important;
          }
          footer.basecolor_inverted {
            background: #ffffff !important;
            background-image: none !important;
            color: #333333 !important;
          }
          </style>'''

          changed = 0
          for path in Path('site/dist').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'Mangler forventet header i {path}')
              text = text.replace(marker, marker + '\n' + banner, 1)
              if '</head>' not in text:
                  raise SystemExit(f'Mangler </head> i {path}')
              text = text.replace('</head>', white_chrome + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
              changed += 1

          print(f'Opdaterede header og footer i {changed} HTML-filer')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
