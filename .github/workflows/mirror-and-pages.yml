name: Deploy clone-v1 to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RELEASE_TAG: clone-v1
  ASSET_NAME: hannerup-kirke-klon.zip
  ASSET_SHA256: 3987363c5eaa61dc162ca0e5ebbba330446af58d6216a68e92a53ca40a25e970

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'clone-v1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download clone-v1 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir release
          echo "$ASSET_SHA256  release/$ASSET_NAME" | sha256sum --check -

      - name: Extract release asset and select dist
        run: |
          unzip -q "release/$ASSET_NAME" -d site
          test -d site/dist
          touch site/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
